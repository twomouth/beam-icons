<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#25a55a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BEAM 実務">
  <title>BEAM 実務</title>
  <link rel="apple-touch-icon" href="https://twomouth.github.io/beam-icons/beam-work.png?v=20260918c">
  <link rel="icon" type="image/png" href="https://twomouth.github.io/beam-icons/beam-work.png?v=20260918c">
  <link rel="manifest" href="./manifest.webmanifest?v=20260918b">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f5f7fa; color:#172033; padding:24px; }
    .card { width:min(440px,100%); background:#fff; border-radius:22px; padding:28px; box-shadow:0 14px 45px rgba(24,37,56,.13); text-align:center; }
    .icon { width:96px; height:96px; border-radius:22px; display:block; margin:0 auto 16px; }
    h1 { margin:0 0 8px; font-size:26px; }
    p { margin:8px 0; line-height:1.65; color:#596579; }
    .small { font-size:13px; }
    button { width:100%; margin-top:16px; border:0; border-radius:12px; padding:13px 16px; font:inherit; font-weight:800; color:#fff; background:#25a55a; cursor:pointer; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="https://twomouth.github.io/beam-icons/beam-work.png" alt="">
    <h1>BEAM 実務</h1>
    <div id="browserHelp">
      <p>このページをホーム画面に追加してください。</p>
      <p class="small">ホーム画面から起動すると、自動でBEAMを開きます。</p>
      <button id="openNow" type="button">BEAMを開く</button>
    </div>
    <p id="status" class="small"></p>
  </main>
<script>
(function () {
  'use strict';
  const PORTAL = 'work';
  const GAS_BASE = 'https://script.google.com/macros/s/AKfycbz-fuUpCKr5s6NhlsKXarmVDSpuRjsoDZ0hBN6Ef8HRZTrZcLSvkctLv54QqwHFzrTx/exec';

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  function isMobileBrowser() {
    const ua = String(navigator.userAgent || '');
    const uaMobile = /iPhone|iPad|iPod|Android/i.test(ua);
    const touchMobile = navigator.maxTouchPoints > 1 && Math.min(window.innerWidth, window.innerHeight) < 900;
    return uaMobile || touchMobile;
  }

  function openBeam() {
    // GitHub側にはアクセスキーも端末トークンも保存しない。
    location.replace(GAS_BASE + '?portal=' + encodeURIComponent(PORTAL));
  }

  document.getElementById('openNow').addEventListener('click', openBeam);

  if (isStandalone() || !isMobileBrowser()) {
    document.getElementById('browserHelp').innerHTML = '<p class="small">BEAMを開いています...</p>';
    document.getElementById('status').textContent = '認証はBEAM側で行います。GitHubには認証情報を保存しません。';
    window.setTimeout(openBeam, 150);
  } else {
    document.getElementById('status').textContent = '認証はBEAM側で行います。GitHubには認証情報を保存しません。';
  }
})();
</script>
</body>
</html>
