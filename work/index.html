<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#25a55a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BEAM 実務">
  <title>BEAM 実務</title>
  <link rel="apple-touch-icon" href="https://twomouth.github.io/beam-icons/beam-work.png?v=20260918c">
  <link rel="icon" type="image/png" href="https://twomouth.github.io/beam-icons/beam-work.png?v=20260918c">
  <link rel="manifest" href="./manifest.webmanifest?v=20260918b">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f5f7fa; color:#172033; padding:24px; }
    .card { width:min(440px,100%); background:#fff; border-radius:22px; padding:28px; box-shadow:0 14px 45px rgba(24,37,56,.13); text-align:center; }
    .icon { width:96px; height:96px; border-radius:22px; display:block; margin:0 auto 16px; }
    h1 { margin:0 0 8px; font-size:26px; }
    p { margin:8px 0; line-height:1.65; color:#596579; }
    .small { font-size:13px; }
    button { width:100%; margin-top:16px; border:0; border-radius:12px; padding:13px 16px; font:inherit; font-weight:800; color:#fff; background:#25a55a; cursor:pointer; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="https://twomouth.github.io/beam-icons/beam-work.png" alt="">
    <h1>BEAM 実務</h1>
    <div id="browserHelp">
      <p>このページをホーム画面に追加してください。</p>
      <p class="small">ホーム画面から起動すると、自動でBEAMを開きます。</p>
      <button id="openNow" type="button">BEAMを開く</button>
    </div>
    <p id="status" class="small"></p>
  </main>
<script>
(function () {
  'use strict';

  const PORTAL = 'work';
  const GAS_BASE = 'https://script.google.com/macros/s/AKfycbz-fuUpCKr5s6NhlsKXarmVDSpuRjsoDZ0hBN6Ef8HRZTrZcLSvkctLv54QqwHFzrTx/exec';
  const DEVICE_TOKEN_KEY = 'beam_device_token_v2';

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  function readToken() {
    try {
      const token = String(localStorage.getItem(DEVICE_TOKEN_KEY) || '').trim();
      return token.indexOf('BDT1_') === 0 ? token : '';
    } catch (err) {
      return '';
    }
  }

  function saveToken(token) {
    try {
      localStorage.setItem(DEVICE_TOKEN_KEY, String(token || '').trim());
      return true;
    } catch (err) {
      return false;
    }
  }

  function clearToken() {
    try { localStorage.removeItem(DEVICE_TOKEN_KEY); } catch (err) {}
  }

  function launcherUrl() {
    return location.origin + location.pathname;
  }

  function readHash() {
    const raw = String(location.hash || '').replace(/^#/, '');
    const params = new URLSearchParams(raw);
    return {
      token: String(params.get('beam_token') || '').trim(),
      clear: params.get('beam_clear') === '1'
    };
  }

  function cleanHash() {
    if (!location.hash) return;
    try {
      history.replaceState(null, document.title, location.pathname + location.search);
    } catch (err) {}
  }

  function openBeam() {
    const token = readToken();
    let url = GAS_BASE
      + '?portal=' + encodeURIComponent(PORTAL)
      + '&launcher=' + encodeURIComponent(launcherUrl());

    if (token) {
      url += '#beam_token=' + encodeURIComponent(token);
    }

    location.replace(url);
  }

  const handoff = readHash();

  if (handoff.clear) {
    clearToken();
    cleanHash();
  }

  if (handoff.token.indexOf('BDT1_') === 0) {
    if (!saveToken(handoff.token)) {
      document.getElementById('status').textContent =
        '端末認証情報を保存できませんでした。ブラウザ設定を確認してください。';
      return;
    }

    cleanHash();
    document.getElementById('browserHelp').innerHTML =
      '<p class="small">端末認証を保存しました。BEAMを開いています...</p>';
    openBeam();
    return;
  }

  document.getElementById('openNow').addEventListener('click', openBeam);

  if (isStandalone()) {
    document.getElementById('browserHelp').innerHTML =
      '<p class="small">BEAMを開いています...</p>';
    openBeam();
  } else {
    document.getElementById('status').textContent =
      '初回のみBEAM画面でアクセスキーを入力します。';
  }
})();
</script>
</body>
</html>
